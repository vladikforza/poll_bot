<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создать опрос</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Создать новый опрос</h1>

        <form method="POST">
            <input type="text" name="question" placeholder="Введите вопрос" required>

            <h2>Варианты ответов:</h2>
            <input type="text" name="options" placeholder="Вариант 1" required>
            <input type="text" name="options" placeholder="Вариант 2" required>
            <input type="text" name="options" placeholder="Вариант 3">
            <input type="text" name="options" placeholder="Вариант 4">

            <button type="submit" class="button button-primary">Создать</button>
        </form>

        <a href="{{ url_for('index') }}" class="button button-secondary">Назад</a>
    </div>
</body>
</html>
