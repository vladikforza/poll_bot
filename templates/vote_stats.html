<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Статистика голосования</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>{{ vote['question'] }}</h1>
        <ul>
            {% for result in results %}
            <li>{{ result["option"] }}: {{ result["votes"] }} голосов</li>
            {% endfor %}
        </ul>
        <a href="{{ url_for('votes_index') }}" class="button button-secondary">Назад</a>
    </div>
</body>
</html>
