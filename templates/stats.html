<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Статистика опроса</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="container">
    <h1>Результаты опроса</h1>
    <h2>{{ poll['question'] }}</h2>

    <canvas id="pollChart" width="400" height="200"></canvas>

    <a href="{{ url_for('index') }}" class="button button-secondary">Назад</a>
</div>

<script>
    const ctx = document.getElementById('pollChart').getContext('2d');
    const pollChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: {{ results | map(attribute='option') | list | tojson }},
            datasets: [{
                label: 'Количество голосов',
                data: {{ results | map(attribute='votes') | list | tojson }},
                backgroundColor: 'rgba(54, 162, 235, 0.6)',
                borderColor: 'rgba(54, 162, 235, 1)',
                borderWidth: 1,
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        stepSize: 1,
                        precision: 0
                    },
                    title: {
                        display: true,
                        text: 'Голоса'
                    }
                }
            }
        }
    });
</script>
</body>
</html>
